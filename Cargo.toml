[package]
name = "daimonos"
version = "0.1.0"
edition = "2021"
description = "Daimonos — an agent-optimized OS layer for remote LLM agents"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
regex = "1"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
toml = "0.8"
