[package]
name = "daimonos"
version = "0.1.0"
edition = "2021"
description = "Daimonos — an agent-optimized OS layer for remote LLM agents"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
regex = "1"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
toml = "0.8"
notify = { version = "7", features = ["macos_fsevent"] }
json-patch = "3"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
starlark = "0.13"
allocative = "0.3"
rust-mcp-sdk = { version = "0.9", default-features = false, features = ["server", "stdio"] }
similar = "3"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
