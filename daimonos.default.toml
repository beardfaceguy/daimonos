# daimonos default configuration
# Copy to ~/.config/daimonos/config.toml or place next to the binary to override.

[index]
# Maximum directory traversal depth
max_depth = 20
# Skip files larger than this (bytes)
max_file_size = 1_000_000
# Bytes to sniff for null bytes when detecting binary files
binary_sniff_bytes = 512
# File extensions to skip during indexing (known binary formats)
skip_extensions = [
  "png", "jpg", "jpeg", "gif", "webp", "ico", "bmp", "svg",
  "mp3", "mp4", "avi", "mov", "mkv", "flac", "wav", "ogg", "webm",
  "zip", "tar", "gz", "bz2", "xz", "7z", "rar", "zst",
  "exe", "dll", "so", "dylib", "o", "a", "lib",
  "wasm", "pyc", "pyo", "class",
  "pdf", "doc", "docx", "xls", "xlsx", "ppt", "pptx",
  "sqlite", "db", "mdb",
  "ttf", "otf", "woff", "woff2", "eot",
]

[search]
# Default max results for grep when not specified by caller
default_grep_max = 100
# Default max results for find (trigram search) when not specified
default_find_max = 20

[process]
# Number of trailing output lines returned by poll
poll_tail_lines = 20
# Max characters of exec stdout/stderr before truncation (keeps first+last lines)
exec_output_max_chars = 100_000
# Additional directories to prepend to PATH for exec/bg commands.
# Common tool dirs (~/.cargo/bin, ~/.local/bin, etc.) are auto-detected;
# use this for non-standard locations.
# extra_path = ["/opt/custom/bin"]
# Max entries in session-level caches (read_cache, exec_usage).
# When exceeded, oldest/least-used entries are evicted.
max_cache_entries = 1024

# Registered tools for the tool runner.
# Each tool gets a [tools.<id>] section.
# Tools with id "x07" use the built-in X07 plugin; all others use the generic CLI plugin.

# [tools.x07]
# bin = "/path/to/x07"
# source_pattern = "**/*.x07.json"
# manifest = "x07.json"

# [tools.cargo]
# bin = "cargo"
# source_pattern = "**/*.rs"
# manifest = "Cargo.toml"
