# Tool text shown to models. `full` is used by agent runtimes and
# full-verbosity MCP schemas. Optional `terse` text replaces it in
# compact/terse MCP list_tools responses. Nested `[tool.parameters]` tables
# supply descriptions for top-level JSON Schema properties.

[read_file]
full = """Read file. Returns {content, lines} or {unchanged:true, lines} if already read and unmodified."""
terse = """Read file → {content, lines}."""

[read_file.parameters]
path = "Relative path"
offset = "Start line (0-based)"
limit = "Max lines"
[write_file]
full = """Write file, creating parent dirs. The ENTIRE `content` is emitted as output tokens and must fit in one turn's output budget, so an oversized write can hit the model output limit and be discarded unwritten. Use `edit_file` for any change to an existing file (small diffs, never a full rewrite); build a large NEW file incrementally — a bounded first section here, then extend it with append_file — rather than emitting it all at once."""

[write_file.parameters]
path = "Relative path"
[edit_file]
full = """Preferred over rewriting a file with write_file — you emit only the changed hunks, not the whole file, so it stays well within the output budget. String-replace edits: `edits` is [old, new, old, new, ...]. Keep each `old` as SMALL as possible — just the changing line(s) plus only enough surrounding context to be UNIQUE in the file; do not paste large unchanged regions. Leading-indentation differences are tolerated (match is by line content), so don't reproduce exact whitespace. Returns {applied, diffs}; on a miss or ambiguous match it returns a `failures` array naming the offending `old` and why — fix just that pair (make it unique or correct it), don't re-send the whole file."""

[edit_file.parameters]
path = "Relative path"
edits = "[old, new, old, new, ...] pairs. Each `old`: minimal + unique; whitespace-tolerant."
[append_file]
full = """Append `content` to the end of a file, creating it (and parent dirs) if absent. Only the appended `content` is emitted as output tokens, so this is how you build a large file across several bounded calls: write a first section with write_file, then extend it with repeated append_file calls, keeping every call well under one turn's output budget. Returns {ok, appended_bytes} — appended_bytes is the number of UTF-8 bytes written (not characters)."""

[append_file.parameters]
path = "Relative path; created (with parent dirs) if absent."
content = "Text appended verbatim to the end of the file."
[search]
full = """Regex content search or trigram relative filename/path search. File mode populates lazily and reports index coverage."""

[search.parameters]
mode = "Default: content; files searches relative paths"
path = "Optional scope dir"
glob = "Optional filename glob, e.g. *.rs"
[workspace_info]
full = """Detailed workspace info (session state, root listing, index stats). Basic info is already in server instructions — only call if you need index stats or full detail."""
terse = """Workspace info: session, root listing, index stats."""

[exec]
full = """Run command. Returns {exit, out, err?}. Output auto-truncated if very large."""
terse = """Run command → {exit, out, err?}."""

[batch]
full = """Multiple tools in one call. Always batch when you need 2+ independent reads/searches. E.g. [{tool:"read_file",arguments:{path:"a.rs"}},{tool:"search",arguments:{pattern:"TODO"}}]."""
terse = """Run 2+ independent tools in one call; get_tool_schema for shape."""

[get_tool_schema]
full = """Get full inputSchema for tool(s). Call before using a tool whose schema was not in list_tools."""
terse = """Get full inputSchema for tool(s) before use."""

[get_tool_schema.parameters]
tools = "Tool name(s)"
[execute_script]
full = """Run a Starlark script with all tools as built-in functions. Starlark is Python-like, not Python: there is no `import`, and top-level `for`, `while`, `if`, and `try` statements are rejected. Put control flow inside `def main(): ...` and finish with `result = main()`. Use `list_tool_signatures` before unfamiliar calls for the exact built-in signatures. Intermediate results stay in the sandbox; only the `result` variable is returned, making one script much cheaper than sequential tool calls."""
terse = """Run Starlark (no `import` or top-level `for`/control flow); use `def main()` and `result = main()`. Tools are built-ins; see `list_tool_signatures`."""

[execute_script.parameters]
code = "Starlark source (not Python): no imports or top-level control flow. Set `result`; wrap loops/conditionals in a function."
timeout = "Max seconds (default: 60)"
[update_plan]
full = """Replace the current execution plan for a multi-step task. Send the complete list each time statuses change. Use an empty list to clear the plan."""
terse = """Replace the complete multi-step execution plan and statuses."""

[update_plan.parameters]
entries = "Complete ordered plan entries with content, priority, and status"
[kgl_query]
full = """Query the KGL knowledge graph to orient in a codebase WITHOUT reading source: find defs by intent/name, trace dependencies and calls, see what state a def reads/mutates, list open questions left by prior agents, and compute blast radius. Action 'index' (re)builds the graph from the workspace; 'check' reports KGL-completeness."""
terse = """Query KGL graph: find defs, deps, calls, state, open questions, blast radius; index/check."""

[kgl_query.parameters]
args = "orient needs {task} (one bundled call: matching defs + intent/open-questions + edges + dependents — prefer this for orientation); node/neighbors/blast_radius need {hash}; find needs {q}; writers_of needs {resource}; neighbors optional {kind,dir}; check optional {mode}."
[kgl_assert]
full = """Declare the non-derivable KGL layer for a def: its intent/purpose (+ rationale, open questions), authoring provenance, or a typed edge (reads/mutates/calls/depends_on). This is how an authoring agent records WHY code exists and what it touches — the part no derived graph provides. Get the target def 'hash' from kgl_query find/node."""
terse = """Declare KGL layer for a def: intent, provenance, or typed edge."""

[kgl_assert.parameters]
args = "intent: {hash, purpose, rationale?, open_questions?[]}; provenance: {hash, authored_by, session_id?, assumptions?[], supersedes?[]}; declare_edge: {from, to, kind} where kind is one of calls|depends_on|reads|mutates (snake_case)."
[register_agent]
full = """Register (or refresh) your agent identity for this workspace so other daimonos agents can address you (agent mail, ADR-009). Idempotent by name: re-registering the same name updates your profile and last-seen time and keeps your original identity. Omit 'name' to be assigned a memorable AdjectiveNoun handle (e.g. BlueLake). Names are unique per workspace."""
terse = """Register/refresh your agent identity (memorable name) for this workspace; minted if omitted."""

[register_agent.parameters]
name = "Memorable AdjectiveNoun handle (ASCII alphanumeric, 1-64 chars). Minted for you if omitted. Unique per workspace."
program = "Optional: the agent program you run as (e.g. codex-cli, claude-code)."
model = "Optional: the underlying model (e.g. gpt5, opus)."
task = "Optional: a short description of what you're currently working on."
session_id = "Optional: your agent-runtime session id; defaults to the daimonos session id when omitted."
[list_agents]
full = """List agents registered in this workspace, most-recently-seen first (agent mail, ADR-009). Use this to discover who else is working here and the names you can address messages to."""
terse = """List workspace agents (most-recently-seen first)."""

[list_agents.parameters]
limit = "Max agents to return (most-recently-seen first). Defaults to the configured inbox page size."
[send_message]
full = """Send a directed message to one or more agents in this workspace (agent mail, ADR-009). Addressed by agent name via `to` (and optional `cc`); at least one recipient is required — there is deliberately NO broadcast. Set `importance` and `ack_required` to flag messages that need explicit acknowledgement. Use `reply_message` (not this) to reply within a thread."""
terse = """Send a directed message (to/cc, subject, body, importance, ack) — no broadcast."""

[send_message.parameters]
sender = "Your registered agent name (the message's from)."
to = "Primary recipient agent names (array). Provide recipients via to and/or cc; a message with no recipients is rejected (no broadcast)."
cc = "Carbon-copy recipient agent names (array)."
subject = "Short subject line."
body = "Message body (Markdown)."
importance = "One of low|normal|high|urgent (default normal)."
ack_required = "If true, recipients should acknowledge receipt."
[reply_message]
full = """Reply to an existing message, staying in its thread (agent mail, ADR-009). Give the parent message id as `reply_to`; if you omit `to`/`cc`, the reply is addressed back to the original sender. Inherits the parent's importance/ack semantics unless you override them."""
terse = """Reply within a message's thread; defaults recipient to the original sender."""

[reply_message.parameters]
sender = "Your registered agent name (the reply's from)."
reply_to = "Id of the message you are replying to."
to = "Optional explicit recipients (array); defaults to the original sender."
cc = "Optional carbon-copy recipients (array)."
subject = "Subject line (typically 'Re: ...')."
body = "Reply body (Markdown)."
importance = "One of low|normal|high|urgent."
ack_required = "If true, recipients should acknowledge receipt."
[fetch_inbox]
full = """Fetch your inbox for this workspace, newest-first (agent mail, ADR-009). Filter with `unread_only`, `min_importance`, `since`, and `limit`. Each entry includes the message plus your per-recipient read/ack state. Reading does not auto-acknowledge — use mark_read / acknowledge."""
terse = """Fetch your inbox (newest-first) with unread/importance/since/limit filters."""

[fetch_inbox.parameters]
agent = "Your registered agent name (whose inbox to read)."
unread_only = "If true, only return messages you haven't read yet."
min_importance = "Only return messages at or above this level (low|normal|high|urgent)."
since = "Only messages created strictly after this RFC-3339 timestamp."
limit = "Max messages to return. Defaults to the configured inbox page size."
[mark_read]
full = """Mark one message read for you (agent mail, ADR-009). Idempotent: a second call keeps the original read time. Per-recipient — only affects your view."""
terse = """Mark one message read (per-recipient; idempotent)."""

[mark_read.parameters]
agent = "Your registered agent name."
message_id = "Id of the message to mark read."
[acknowledge]
full = """Acknowledge one message addressed to you (also marks it read) — a lightweight non-textual reply for ack_required messages (agent mail, ADR-009). Idempotent: repeat calls keep the original ack time."""
terse = """Acknowledge one message (also marks read; idempotent)."""

[acknowledge.parameters]
agent = "Your registered agent name."
message_id = "Id of the message to acknowledge."
[fetch_thread]
full = """Fetch every message in a thread, oldest-first, bounded by a hard cap (agent mail, ADR-009). Pass the `thread_id` from a message or a send/reply receipt. Reconstruction is a flat, bounded read — never a recursive walk."""
terse = """Fetch a thread's messages (oldest-first, bounded)."""

[fetch_thread.parameters]
thread_id = "Id of the thread to fetch (from a message or a send/reply receipt)."
[reserve_paths]
full = """Post ADVISORY reservations on file glob patterns for this workspace (agent mail, ADR-009) — a soft \"I'm working here\" signal to other agents, NOT a lock (it never blocks a write). Returns the granted reservations plus any conflicts with other agents' active exclusive reservations. Patterns are opaque globs (e.g. src/api/*.rs), never resolved against the filesystem."""
terse = """Advisory-reserve file globs (soft signal, not a lock); reports conflicts."""

[reserve_paths.parameters]
agent = "Your registered agent name (the reservation holder)."
paths = "Glob pattern(s) to reserve (array), e.g. [\"src/api/*.rs\"]."
exclusive = "Whether THIS reservation is exclusive (default true). Recorded for future callers: another agent's check overlapping YOUR exclusive reservation is reported a conflict; a shared (exclusive=false) reservation never causes a conflict for others. It does not change whether conflicts against others are reported to you on this call — those are always reported."
reason = "Optional short note on why you're reserving these paths."
ttl_secs = "Lifetime in seconds; clamped to the configured [60, max] range. Defaults to the configured default TTL."
[renew_reservations]
full = """Extend the expiry of all your own active reservations in this workspace (agent mail, ADR-009). Only your unreleased, unexpired reservations are touched."""
terse = """Extend expiry of your own active reservations."""

[renew_reservations.parameters]
agent = "Your registered agent name."
ttl_secs = "New lifetime in seconds from now; clamped to the configured [60, max] range."
[release_reservations]
full = """Release your own reservations in this workspace (agent mail, ADR-009). Omit `paths` to release ALL your active reservations; otherwise release only those whose pattern exactly matches one you give. Idempotent."""
terse = """Release your own reservations (all, or by exact pattern)."""

[release_reservations.parameters]
agent = "Your registered agent name."
paths = "Optional exact pattern(s) to release (array). Omit to release all your active reservations."
[check_conflicts]
full = """Read-only pre-edit check: do the given glob patterns overlap another agent's active exclusive reservation? (agent mail, ADR-009.) Ignores your own reservations and mutates nothing. Use before editing to see if someone else signaled they're working there."""
terse = """Read-only: check paths against others' active reservations."""

[check_conflicts.parameters]
agent = "Your registered agent name (your own reservations are ignored)."
paths = "Glob pattern(s) to check (array)."
[list_reservations]
full = """List your own active (unreleased, unexpired) reservations in this workspace (agent mail, ADR-009)."""
terse = """List your own active reservations."""

[list_reservations.parameters]
agent = "Your registered agent name."
limit = "Max reservations to return (most-recent first)."
[list_tool_signatures]
full = """Python-style function signatures for all tool bindings available in execute_script. Already included in server instructions."""

